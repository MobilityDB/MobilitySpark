name: Maven CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  # ── Linux ────────────────────────────────────────────────────────────────────
  linux:
    name: Build and test — Linux (Java 21 / Spark 3.5)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Derive the MEOS catalog (meos-idl.json via run.py) and build+install the
      # all-families libmeos.so from upstream MobilityDB master, through the shared
      # composite action. It does the full libmeos provisioning itself (PostgreSQL
      # purge, PGDG, PG17, build deps, cmake, install under /usr/local), so no inline
      # apt/PG/cmake steps are needed here. Tracking master (not a pinned commit) keeps
      # the source and the @master derivation toolchain moving together, so the catalog
      # can never drift from the run.py that derives it.
      - name: Provision MEOS catalog + libmeos
        id: provision
        uses: MobilityDB/MEOS-API/.github/actions/provision-meos@master
        with:
          mobilitydb-ref: master
          build-libmeos: "true"

      - name: Stage the derived catalog for the generator
        # The build-time UDF generator (pom.xml, exec-maven-plugin) and GeneratedSurfaceTest
        # both read tools/meos-idl.json; place the derived catalog there so their wiring is
        # unchanged. The catalog is gitignored — it only ever exists as a build artifact.
        run: |
          cp "${{ steps.provision.outputs.catalog-path }}" tools/meos-idl.json
          echo "LD_LIBRARY_PATH=/usr/local/lib" >> "$GITHUB_ENV"

      - name: Check out JMEOS at master
        # The JMEOS jar (org.jmeos:meos:1.0) is built from JMEOS main against the SAME
        # master-derived catalog and libmeos as above — so the jar's FFI surface can never
        # drift from the catalog the generator reads, and JMEOS tracks master in lockstep
        # with this binding.
        uses: actions/checkout@v4
        with:
          repository: MobilityDB/JMEOS
          ref: main
          path: jmeos

      - name: Build + install the JMEOS jar as org.jmeos:meos:1.0
        # JMEOS's own tools/regen-from-catalog.sh is the single runnable definition of this
        # build — it stages the catalog and libmeos, and jmeos-core's generate-sources emits
        # GeneratedFunctions from the catalog, so the jar's signatures stay in lockstep with the
        # commit that produced it. tools/refresh-from-master.sh reaches the same script through
        # the shared chain, so the CI path and the by-hand path cannot drift. The jar plugin
        # writes the plain jar/JMEOS.jar (finalName JMEOS) — jnr-ffi is supplied by this
        # project's own pom, and libmeos is loaded from LD_LIBRARY_PATH, never from the jar —
        # installed under the org.jmeos:meos:1.0 coordinates the generator and UDF runtime
        # consume (not on Maven Central, so built here rather than pulled). Naming LIBMEOS runs
        # JMEOS's FFI suite against the libmeos this job just built, which is what tells a jar
        # that merely compiles from one whose generated surface answers.
        run: |
          CATALOG="${{ steps.provision.outputs.catalog-path }}" \
          LIBMEOS=/usr/local/lib/libmeos.so \
            jmeos/tools/regen-from-catalog.sh
          mvn -B install:install-file \
            -Dfile=jmeos/jar/JMEOS.jar \
            -DgroupId=org.jmeos -DartifactId=meos -Dversion=1.0 -Dpackaging=jar

      - name: Build + generate + unit tests
        # generate-sources runs the catalog-driven UDF generator; test exercises the
        # generated surface against libmeos through JMEOS.
        run: mvn -B clean test
